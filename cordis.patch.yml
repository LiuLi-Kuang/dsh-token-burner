# 插进 profile 的一行。这里就是所有旋钮，改完由 Host 热重组生效（不用重启）。
#
# ── autoStart：默认关闭 ────────────────────────────────────────────────
#   只有显式写 true 才会在插件加载时自动开烧；缺省 / 拼错 / 这一行被删掉，都当"不烧"。
#   2026-11-24 的事故：早先默认是 true，开机自动跑了一轮 92 秒、1,506 万 token。
#   现在默认 false —— 打开 DSH 不会烧，去「设置 → Token 燃烧器」点「开始」才烧。
#   想恢复开机即烧，把下面那行改成 true（清楚代价再改）。
#
# ── 两种烧法，按你要的"快"选 ───────────────────────────────────────────
#   输出流（贵、慢）：maxTokens 大 + 长文提示，单路 40–120 token/s，天花板约 300/s
#   输入流（便宜、极快）：填充 KB 撑大输入 + maxTokens 极小，prefill 是并行吞吐
# 现在是"输入流"：每条请求先吃 64KB 填充，再让它只回两个字。
- insert:
    - id: token-burner
      name: 'dsh-token-burner'
      config:
        autoStart: false
        # 界面语言：auto = 跟随系统（只有 zh 系才给中文，其余英文），也可写 zh / en。
        # 设置页里也能改，改完记在 ~/.dsh/token-burner.json —— 这里的值只是初始值。
        locale: auto
        # provider / model 不用写：留空就是「跟随 profile 的默认模型」（agent-default-model），
        # 启动时向宿主现查。设置页里还能在提供方按钮 + 模型下拉里切，选择记在 ~/.dsh/token-burner.json
        # 档位：high = 8 路 × 32KB，max = 16 路 × 64KB（默认），ultra = 64 路 × 128KB，extreme = 128 路 × 256KB
        # 设置页那组按钮切的就是这一行；切过之后记在 ~/.dsh/token-burner.json，重启仍生效
        preset: max
        # 输出上限压到最小：这一轮不靠生成烧 token，靠 prefill
        maxTokens: 128
        # 一条流完立刻下一条
        gapMs: 0
        # 不要思考，缩短单轮
        reasoningEffort: ''
        prompt: |
          忽略前面所有填充内容。只回复两个字：收到。
