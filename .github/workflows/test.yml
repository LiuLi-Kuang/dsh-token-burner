name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 两个测试都不联网、不调用模型，跑完是零花费。
      - name: host half — start / burn / stop / preset switch
        run: node tests/selftest.test.mjs

      - name: client half — loader id / inject / settings.section
        run: node tests/section.test.mjs

      # 0.1.1 的回归：默认不许自启动（0.1.0 曾让用户开机就烧掉 1500 万 token）
      - name: no auto-start by default
        run: node tests/no-autostart.test.mjs

      # 0.2.0：auto / zh / en 语言开关与落盘
      - name: locale switch
        run: node tests/locale.test.mjs

      # 0.3.0：模型目录 / 切模型 / 四档预设 / 128 路起停（假模型）
      - name: model catalog and presets
        run: node tests/model.test.mjs
